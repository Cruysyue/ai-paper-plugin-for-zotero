name: Release Zotero plugin

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: zotero-release
  queue: max

jobs:
  release:
    if: github.event.created
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run tests
        run: node --test tests/*.test.cjs

      - name: Build release assets
        id: build
        run: |
          package=$(python3 build.py --release "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY")
          printf 'package=%s\n' "$package" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ steps.build.outputs.package }}
        run: |
          latest_tag=$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' |
              awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/' | sort -V | tail -n 1
          )
          newest_tag=$(printf '%s\n' "$latest_tag" "$GITHUB_REF_NAME" | sort -V | tail -n 1)
          if [[ "$newest_tag" != "$GITHUB_REF_NAME" ]]; then
            echo "$latest_tag is already published. Use a newer version for Zotero updates." >&2
            exit 1
          fi

          gh release create "$GITHUB_REF_NAME" "$PACKAGE" dist/updates.json \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --latest \
            --title "AiPluginForZotero ${GITHUB_REF_NAME#v}"
